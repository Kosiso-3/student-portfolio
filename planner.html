<main>
<h1>Academic planner</h1>
<p class="lead">Add assignments, tick them off, and delete what you no longer need. Your list is saved in this browser.</p>
<form id="taskForm" class="inline-form" novalidate>
  <label for="taskInput">New task</label>
  <input type="text" id="taskInput" placeholder="e.g. Submit CSC 201 report" autocomplete="off">
  <label for="taskDate">Due date</label>
  <input type="date" id="taskDate">
  <button class="btn" type="submit">Add task</button>
</form>
<p id="taskError" class="error" role="alert"></p>
<p id="taskCount" class="count" aria-live="polite"></p>
<ul id="taskList" class="tasks"></ul>
</main>
<footer class="site-footer">
